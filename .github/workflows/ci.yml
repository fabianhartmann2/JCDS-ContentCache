name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Check formatting
        run: |
          gofmt -w .
          git diff --exit-code
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build binaries
        run: go build ./cmd/cache-helper ./cmd/mock-upstream
      - name: Build container image
        run: docker build --tag jcds-content-cache:ci .
