services:
  cache-helper:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      CACHE_HELPER_LISTEN_ADDRESS: ":8080"
      CACHE_STORE_ROOT: /srv/jamf-store
    volumes:
      - package-store:/srv/jamf-store
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      cache-helper:
        condition: service_started
    ports:
      - "8081:8080"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - package-store:/srv/jamf-store:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  package-store:
