worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    server_tokens off;

    map $uri $package_request_loggable {
        default 0;
        ~^/(packages|Packages)/ 1;
    }

    map $uri $package_filename {
        default "";
        ~^/(?:packages|Packages)/(?<package_filename_value>[^/]+)$ $package_filename_value;
    }

    map $http_range $package_range_kind {
        "" none;
        ~*, multi;
        ~*^bytes=0-[0-9]*$ start_zero;
        ~*^bytes=[1-9][0-9]*-[0-9]*$ resume;
        ~*^bytes=-[0-9]+$ suffix;
        default other;
    }

    map $http_if_range $package_if_range_kind {
        "" absent;
        default present;
    }

    map $http_user_agent $package_client_kind {
        "" absent;
        ~*jamf jamf;
        ~*(storedownloadd|softwareupdated|nsurlsessiond) macos_system;
        ~*installer macos_installer;
        ~*curl curl;
        ~*mozilla browser;
        default other;
    }

    map $sent_http_content_range $package_response_range {
        "" absent;
        default present;
    }

    map $sent_http_content_length $package_response_length {
        "" absent;
        default present;
    }

    map $request_completion $package_completion {
        "OK" complete;
        default incomplete;
    }

    log_format package_behavior escape=json
        '{"event":"package_request",'
        '"timestamp":"$time_iso8601",'
        '"client":"$remote_addr",'
        '"filename":"$package_filename",'
        '"client_kind":"$package_client_kind",'
        '"user_agent":"$http_user_agent",'
        '"request_id":"$request_id",'
        '"connection":$connection,'
        '"connection_requests":$connection_requests,'
        '"http_protocol":"$server_protocol",'
        '"method":"$request_method",'
        '"range_kind":"$package_range_kind",'
        '"range":"$http_range",'
        '"if_range":"$package_if_range_kind",'
        '"if_range_value":"$http_if_range",'
        '"status":$status,'
        '"source":"$sent_http_x_package_source",'
        '"response_range":"$package_response_range",'
        '"response_content_range":"$sent_http_content_range",'
        '"response_length":"$package_response_length",'
        '"response_content_length":"$sent_http_content_length",'
        '"bytes_sent":$body_bytes_sent,'
        '"request_seconds":$request_time,'
        '"upstream_status":"$upstream_status",'
        '"upstream_seconds":"$upstream_response_time",'
        '"completion":"$package_completion"}';

    access_log /dev/stdout package_behavior if=$package_request_loggable;
    # Per-request upstream errors include the raw request line. Keep only
    # critical NGINX diagnostics; package outcomes remain in package_behavior.
    error_log /dev/stderr crit;

    upstream cache_helper {
        server cache-helper:8080;
        keepalive 16;
    }

    server {
        # Development listener. Production will terminate TLS on port 8443.
        listen 8080;
        server_name _;

        location /Packages/ {
            rewrite ^/Packages/(.*)$ /packages/$1 last;
        }

        location /packages/ {
            limit_except GET HEAD {
                deny all;
            }

            root /srv/jamf-store;
            try_files $uri @package_miss;

            add_header X-Package-Source LOCAL always;
            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
        }

        location @package_miss {
            proxy_pass http://cache_helper;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            # Preserve Range only as far as the helper so an in-flight range
            # follower can wait for atomic publication and then receive LOCAL
            # 206 semantics. The helper never forwards it to JCDS.

            proxy_buffering on;
            proxy_connect_timeout 10s;
            proxy_read_timeout 2h;
            proxy_send_timeout 2h;
            proxy_ignore_client_abort on;

            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /livez {
            proxy_pass http://cache_helper;
        }

        location = /readyz {
            proxy_pass http://cache_helper;
        }

        location / {
            return 404;
        }
    }
}
