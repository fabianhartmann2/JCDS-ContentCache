worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format package_cache
        '$remote_addr "$request" $status bytes=$body_bytes_sent '
        'source=$sent_http_x_package_source request_id=$request_id';

    access_log /var/log/nginx/access.log package_cache;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    server_tokens off;

    upstream cache_helper {
        server cache-helper:8080;
        keepalive 16;
    }

    server {
        # Development listener. Production will terminate TLS on port 8443.
        listen 8080;
        server_name _;

        location /packages/ {
            limit_except GET HEAD {
                deny all;
            }

            root /srv/jamf-store;
            try_files $uri @package_miss;

            add_header X-Package-Source LOCAL always;
            add_header X-Content-Type-Options nosniff always;
        }

        location @package_miss {
            proxy_pass http://cache_helper;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Range "";
            proxy_set_header If-Range "";

            proxy_buffering on;
            proxy_connect_timeout 10s;
            proxy_read_timeout 2h;
            proxy_send_timeout 2h;
            proxy_ignore_client_abort on;

            add_header X-Package-Source JCDS always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /livez {
            proxy_pass http://cache_helper;
        }

        location = /readyz {
            proxy_pass http://cache_helper;
        }

        location / {
            return 404;
        }
    }
}
