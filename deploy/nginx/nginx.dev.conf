user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    log_format package '$remote_addr "$request" $status bytes=$body_bytes_sent source=$sent_http_x_package_source';
    access_log /dev/stdout package;
    error_log /dev/stderr warn;

    upstream cache_helper {
        server cache-helper:8080;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 0;

        location = /health/live {
            proxy_pass http://cache_helper;
        }

        location = /health/ready {
            proxy_pass http://cache_helper;
        }

        location /packages/ {
            root /srv/jamf-store;
            disable_symlinks on from=/srv/jamf-store;
            try_files $uri @fetch_from_jamf;
            add_header X-Package-Source LOCAL always;
        }

        location @fetch_from_jamf {
            proxy_pass http://cache_helper;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Range "";
            proxy_set_header If-Range "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_ignore_client_abort on;
            proxy_connect_timeout 15s;
            proxy_read_timeout 2h;
            proxy_send_timeout 2h;
        }

        location / {
            return 404;
        }
    }
}

